<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF-26 Control de Envíos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {

            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1544984243-ec57ea16fe25?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #343a40;
            color: #333;
        }
        .card {
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
        }
        .table-hover tbody tr:hover { background-color: #e9ecef; cursor: pointer; }
        #mensajeAlerta { display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4 shadow">
    <div class="container">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2830/2830305.png" alt="Camión" width="40" height="40" class="me-3" style="filter: brightness(0) invert(1);">
                Paquetería Express - Control de Envíos
            </span>
    </div>
</nav>

<div class="container pb-5">
    <div id="mensajeAlerta" class="alert alert-dismissible fade show" role="alert">
        <span id="textoAlerta"></span>
        <button type="button" class="btn-close" onclick="ocultarAlerta()"></button>
    </div>

    <div class="row">
        
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-header bg-dark text-white d-flex align-items-center" style="border-top-left-radius: 10px; border-top-right-radius: 10px;">
                    <img src="https://cdn-icons-png.flaticon.com/512/7893/7893979.png" alt="Avión" width="30" height="30" class="me-2" style="filter: brightness(0) invert(1);">
                    <h5 class="mb-0" id="tituloFormulario">Registrar Nuevo Envío</h5>
                </div>
                <div class="card-body">
                    <form id="formEnvio">
                        <input type="hidden" id="envioId" value="">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Destinatario</label>
                            <input type="text" class="form-control" id="destinatario" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Peso (kg)</label>
                            <input type="number" step="0.01" class="form-control" id="peso" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Paquete</label>
                            <select class="form-select" id="tipoPaquete">
                                <option value="Caja">Caja</option>
                                <option value="Flyer">Flyer</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Medidas (cm)</label>
                            <input type="text" class="form-control" id="medidas" placeholder="Ej: 30x20x10">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Fecha de Envío</label>
                            <input type="date" class="form-control" id="fechaEnvio" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Destino / Tipo de Envío</label>
                            <select class="form-select" id="tipoEnvioId" required>
                                <option value="">Seleccione un destino...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Estado</label>
                            <select class="form-select" id="estado" required>
                                <option value="recibido">Recibido</option>
                                <option value="en_transito">En Tránsito</option>
                                <option value="entregado">Entregado</option>
                                <option value="cancelado">Cancelado</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2 fw-bold" id="btnGuardar">Guardar Envío</button>
                        <button type="button" class="btn btn-secondary w-100 d-none" id="btnCancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
                    </form>
                </div>
            </div>
        </div>


        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center" style="border-top-left-radius: 10px; border-top-right-radius: 10px;">
                    <h5 class="mb-0">Lista de Envíos</h5>
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control form-control-sm" placeholder="Buscar destinatario..." id="filtroDestinatario">
                        <select class="form-select form-select-sm" id="filtroEstado">
                            <option value="">Filtrar por estado...</option>
                            <option value="recibido">Recibido</option>
                            <option value="en_transito">En Tránsito</option>
                            <option value="entregado">Entregado</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 text-center align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Destinatario</th>
                            <th>Peso</th>
                            <th>Empaque</th>
                            <th>Destino</th>
                            <th>Costo Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tablaEnvios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/envios';
    const API_TIPOS = '/api/tipos-envio';

    document.addEventListener('DOMContentLoaded', () => {
        cargarTiposEnvio();
        cargarEnvios();
        document.getElementById('formEnvio').addEventListener('submit', guardarEnvio);
        document.getElementById('filtroEstado').addEventListener('change', filtrarPorEstado);
        document.getElementById('filtroDestinatario').addEventListener('input', filtrarPorDestinatario);
    });

    function mostrarAlerta(mensaje, tipo) {
        const alerta = document.getElementById('mensajeAlerta');
        alerta.className = `alert alert-${tipo} alert-dismissible fade show`;
        document.getElementById('textoAlerta').innerText = mensaje;
        alerta.style.display = 'block';
        setTimeout(ocultarAlerta, 5000);
    }
    function ocultarAlerta() { document.getElementById('mensajeAlerta').style.display = 'none'; }

    async function cargarTiposEnvio() {
        try {
            const res = await fetch(API_TIPOS);
            const tipos = await res.json();
            const select = document.getElementById('tipoEnvioId');
            select.innerHTML = '<option value="">Seleccione un destino...</option>';
            tipos.forEach(t => {
                select.innerHTML += `<option value="${t.id}">${t.nombre} (Q${t.tarifaBase})</option>`;
            });
        } catch (e) { console.error("Error cargando tipos", e); }
    }

    async function cargarEnvios() {
        try {
            const res = await fetch(API_URL);
            const envios = await res.json();
            dibujarTabla(envios);
        } catch (e) { console.error("Error cargando envíos", e); }
    }

    function dibujarTabla(envios) {
        const tbody = document.getElementById('tablaEnvios');
        tbody.innerHTML = '';
        if (envios.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-muted py-4">No hay envíos registrados</td></tr>';
            return;
        }
        envios.forEach(e => {
            tbody.innerHTML += `
                    <tr>
                        <td>${e.id}</td>
                        <td class="fw-bold">${e.destinatario}</td>
                        <td>${e.peso} kg</td>
                        <td>${e.tipoPaquete || '-'}<br><small class="text-muted">${e.medidas || ''}</small></td>
                        <td>${e.nombreTipoEnvio}</td>
                        <td class="text-success fw-bold">Q${e.costoTotal.toFixed(2)}</td>
                        <td><span class="badge ${e.estado === 'entregado' ? 'bg-success' : e.estado === 'cancelado' ? 'bg-danger' : 'bg-info text-dark'}">${e.estado}</span></td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1" onclick="editarEnvio(${e.id})">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarEnvio(${e.id})">🗑️</button>
                        </td>
                    </tr>
                `;
        });
    }

    async function guardarEnvio(e) {
        e.preventDefault();
        const id = document.getElementById('envioId').value;
        const envio = {
            destinatario: document.getElementById('destinatario').value,
            peso: parseFloat(document.getElementById('peso').value),
            fechaEnvio: document.getElementById('fechaEnvio').value,
            estado: document.getElementById('estado').value,
            tipoEnvioId: parseInt(document.getElementById('tipoEnvioId').value),
            tipoPaquete: document.getElementById('tipoPaquete').value,
            medidas: document.getElementById('medidas').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(envio)
            });

            if (res.ok) {
                mostrarAlerta(id ? 'Envío actualizado correctamente' : 'Envío registrado con éxito', 'success');
                limpiarFormulario();
                cargarEnvios();
            } else {
                const error = await res.json();
                mostrarAlerta('Error de validación: ' + (error.peso || error.destinatario || 'Verifique los datos'), 'danger');
            }
        } catch (err) { mostrarAlerta('Error de conexión con el servidor', 'danger'); }
    }

    async function editarEnvio(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`);
            const envio = await res.json();
            document.getElementById('envioId').value = envio.id;
            document.getElementById('destinatario').value = envio.destinatario;
            document.getElementById('peso').value = envio.peso;
            document.getElementById('fechaEnvio').value = envio.fechaEnvio;
            document.getElementById('estado').value = envio.estado;
            document.getElementById('tipoPaquete').value = envio.tipoPaquete || 'Caja';
            document.getElementById('medidas').value = envio.medidas || '';

            const selectTipos = document.getElementById('tipoEnvioId');
            for(let i=0; i<selectTipos.options.length; i++) {
                if(selectTipos.options[i].text.includes(envio.nombreTipoEnvio)) {
                    selectTipos.selectedIndex = i;
                    break;
                }
            }

            document.getElementById('tituloFormulario').innerText = 'Editar Envío #' + envio.id;
            document.getElementById('btnGuardar').innerText = 'Actualizar Envío';
            document.getElementById('btnGuardar').className = 'btn btn-warning w-100 mb-2 fw-bold';
            document.getElementById('btnCancelar').classList.remove('d-none');
        } catch (e) { console.error(e); }
    }

    async function eliminarEnvio(id) {
        if (!confirm('¿Está seguro de eliminar este envío?')) return;
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (res.ok) {
                mostrarAlerta('Envío eliminado', 'success');
                cargarEnvios();
            }
        } catch (err) { mostrarAlerta('Error al eliminar', 'danger'); }
    }

    function limpiarFormulario() {
        document.getElementById('formEnvio').reset();
        document.getElementById('envioId').value = '';
        document.getElementById('tituloFormulario').innerText = 'Registrar Nuevo Envío';
        document.getElementById('btnGuardar').innerText = 'Guardar Envío';
        document.getElementById('btnGuardar').className = 'btn btn-primary w-100 mb-2 fw-bold';
        document.getElementById('btnCancelar').classList.add('d-none');
    }

    async function filtrarPorEstado() {
        const estado = document.getElementById('filtroEstado').value;
        if (!estado) { cargarEnvios(); return; }
        const res = await fetch(`${API_URL}/filtrar/estado?estado=${estado}`);
        const envios = await res.json();
        dibujarTabla(envios);
    }

    async function filtrarPorDestinatario() {
        const destinatario = document.getElementById('filtroDestinatario').value;
        if (!destinatario) { cargarEnvios(); return; }
        const res = await fetch(`${API_URL}/filtrar/destinatario?destinatario=${destinatario}`);
        const envios = await res.json();
        dibujarTabla(envios);
    }
</script>
</body>
</html>
